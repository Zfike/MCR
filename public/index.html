<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Missed-Call Recovery — Live Dashboard</title>

  <style>
    :root {
      --bg: #0b0f14;
      --card: #131a22;
      --border: #223040;
      --text: #e7edf3;
      --muted: #8fa2b3;
      --accent: #35d07f;
      --accent-dim: #1e7a4c;
      --warn: #f2a93b;
      --danger: #e05252;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 20px 80px;

      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
    }

    .wrap {
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
    }

    /* -----------------------------------------------------------------------
       Header
       ----------------------------------------------------------------------- */

    header {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      line-height: 1.3;
    }

    .sub {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      margin-top: 12px;

      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
    }

    .live-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;
      background: var(--accent);
    }

    /* -----------------------------------------------------------------------
       Statistics
       ----------------------------------------------------------------------- */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;

      margin: 24px 0 28px;
    }

    .stat {
      padding: 16px;

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .stat .num {
      color: var(--accent);

      font-size: 26px;
      font-weight: 700;
      line-height: 1.2;
    }

    .stat .label {
      margin-top: 4px;

      color: var(--muted);
      font-size: 12px;
    }

    /* -----------------------------------------------------------------------
       Actions
       ----------------------------------------------------------------------- */

    .actions {
      margin-bottom: 24px;
    }

    button.simulate {
      padding: 10px 16px;

      background: var(--accent);
      color: #06170f;

      border: none;
      border-radius: 8px;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    button.simulate:hover {
      opacity: 0.9;
    }

    button.simulate:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error {
      margin-top: 10px;

      color: var(--danger);
      font-size: 13px;
    }

    /* -----------------------------------------------------------------------
       Lead list
       ----------------------------------------------------------------------- */

    .lead-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .lead {
      padding: 14px 16px;

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .lead-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      margin-bottom: 8px;
    }

    .lead-from {
      font-size: 15px;
      font-weight: 600;
    }

    .badge {
      display: inline-block;

      padding: 3px 8px;

      border-radius: 999px;

      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge.recovered {
      background: rgba(53, 208, 127, 0.15);
      color: var(--accent);
    }

    .badge.pending {
      background: rgba(242, 169, 59, 0.15);
      color: var(--warn);
    }

    .lead-time {
      margin-bottom: 6px;

      color: var(--muted);
      font-size: 12px;
    }

    .lead-body {
      color: var(--muted);

      font-size: 13px;
      line-height: 1.5;
    }

    /* -----------------------------------------------------------------------
       Empty state
       ----------------------------------------------------------------------- */

    .empty {
      padding: 30px 0;

      color: var(--muted);

      font-size: 14px;
      text-align: center;
    }

    /* -----------------------------------------------------------------------
       Responsive layout
       ----------------------------------------------------------------------- */

    @media (max-width: 600px) {
      body {
        padding: 24px 16px 60px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .lead-top {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">

    <header>
      <h1 id="biz-name">
        Missed-Call Recovery — Live Dashboard
      </h1>

      <div class="sub">
        Every call that would have gone to voicemail,
        and the recovery action that followed.
      </div>

      <div class="live-indicator">
        <span class="live-dot"></span>
        Live
      </div>
    </header>

    <!-- Dashboard statistics -->
    <section class="stats" aria-label="Dashboard statistics">

      <div class="stat">
        <div class="num" id="stat-total">0</div>
        <div class="label">Missed calls</div>
      </div>

      <div class="stat">
        <div class="num" id="stat-recovered">0</div>
        <div class="label">Texts sent</div>
      </div>

      <div class="stat">
        <div class="num" id="stat-rate">0%</div>
        <div class="label">Recovery actions</div>
      </div>

    </section>

    <!-- Demo controls -->
    <section class="actions">
      <button
        class="simulate"
        id="simulate-button"
        type="button"
      >
        Simulate a missed call
      </button>

      <div
        class="error"
        id="error-message"
        hidden
      ></div>
    </section>

    <!-- Lead feed -->
    <section
      id="leads"
      class="lead-list"
      aria-live="polite"
    ></section>

  </main>

  <script>
    const elements = {
      businessName: document.getElementById("biz-name"),
      total: document.getElementById("stat-total"),
      recovered: document.getElementById("stat-recovered"),
      rate: document.getElementById("stat-rate"),
      leads: document.getElementById("leads"),
      simulateButton: document.getElementById("simulate-button"),
      error: document.getElementById("error-message"),
    };

    // -----------------------------------------------------------------------
    // Dashboard data
    // -----------------------------------------------------------------------

    async function fetchLeads() {
      try {
        const response = await fetch("/api/leads");

        if (!response.ok) {
          throw new Error(
            `Server returned ${response.status}`
          );
        }

        const data = await response.json();

        elements.businessName.textContent =
          `${data.businessName} — Live Dashboard`;

        renderLeads(data.leads);
        clearError();
      } catch (error) {
        console.error("Failed to load leads:", error);

        showError(
          "Unable to load dashboard data. Is the server running?"
        );
      }
    }

    // -----------------------------------------------------------------------
    // Rendering
    // -----------------------------------------------------------------------

    function renderLeads(leads) {
      const total = leads.length;

      const recovered = leads.filter(
        (lead) => lead.textSent
      ).length;

      const recoveryRate = total
        ? Math.round((recovered / total) * 100)
        : 0;

      elements.total.textContent = total;
      elements.recovered.textContent = recovered;
      elements.rate.textContent = `${recoveryRate}%`;

      if (!total) {
        elements.leads.innerHTML = `
          <div class="empty">
            No missed calls yet.
            Click "Simulate a missed call" to see the recovery flow.
          </div>
        `;

        return;
      }

      elements.leads.innerHTML = leads
        .map(renderLead)
        .join("");
    }

    function renderLead(lead) {
      const statusClass = lead.textSent
        ? "recovered"
        : "pending";

      const statusText = lead.textSent
        ? "Text sent"
        : "Pending";

      const timestamp = new Date(
        lead.timestamp
      ).toLocaleString();

      return `
        <article class="lead">
          <div class="lead-top">
            <span class="lead-from">
              ${escapeHtml(lead.from)}
            </span>

            <span class="badge ${statusClass}">
              ${statusText}
            </span>
          </div>

          <div class="lead-time">
            ${timestamp} · status: ${escapeHtml(lead.status)}
          </div>

          <div class="lead-body">
            "${escapeHtml(lead.textBody)}"
          </div>
        </article>
      `;
    }

    // Prevent lead data from being interpreted as HTML.
    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    // -----------------------------------------------------------------------
    // Demo actions
    // -----------------------------------------------------------------------

    async function simulateCall() {
      elements.simulateButton.disabled = true;
      elements.simulateButton.textContent = "Simulating...";

      try {
        const response = await fetch(
          "/api/simulate-missed-call",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({}),
          }
        );

        if (!response.ok) {
          throw new Error(
            `Server returned ${response.status}`
          );
        }

        await fetchLeads();
      } catch (error) {
        console.error(
          "Failed to simulate missed call:",
          error
        );

        showError(
          "Unable to simulate the missed call."
        );
      } finally {
        elements.simulateButton.disabled = false;
        elements.simulateButton.textContent =
          "Simulate a missed call";
      }
    }

    // -----------------------------------------------------------------------
    // Error handling
    // -----------------------------------------------------------------------

    function showError(message) {
      elements.error.textContent = message;
      elements.error.hidden = false;
    }

    function clearError() {
      elements.error.textContent = "";
      elements.error.hidden = true;
    }

    // -----------------------------------------------------------------------
    // Initialization
    // -----------------------------------------------------------------------

    elements.simulateButton.addEventListener(
      "click",
      simulateCall
    );

    fetchLeads();

    // Refresh the dashboard periodically so real Twilio events
    // appear without requiring a page refresh.
    setInterval(fetchLeads, 4000);
  </script>
</body>
</html>
